<!DOCTYPE html>
<html>
<head>
<title>RakWrite Patcher</title>
</head>
<body>
<input type="file" id="file">
<button onclick="patch()">Patch</button>
<pre id="log"></pre>
<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
}

function align(v, a) {
    return Math.ceil(v / a) * a;
}

function patch() {
    var fileInput = document.getElementById('file');
    if (!fileInput.files[0]) {
        log('Select a file');
        return;
    }
    document.getElementById('log').textContent = '';

    var reader = new FileReader();
    reader.onload = function(e) {
        var original = new Uint8Array(e.target.result);
        var fileLen = original.length;
        var buf = new ArrayBuffer(fileLen + 0x1000);
        var view = new DataView(buf);
        var bytes = new Uint8Array(buf);
        bytes.set(original, 0);

        var e_lfanew = view.getUint32(0x3C, true);
        if (view.getUint32(e_lfanew, true) != 0x00004550) {
            log('not a valid executable');
            return;
        }
        var numSections = view.getUint16(e_lfanew + 6, true);
        var sizeOfOptHeader = view.getUint16(e_lfanew + 20, true);
        var optOff = e_lfanew + 24;
        var secTableOff = optOff + sizeOfOptHeader;
        var sectionAlignment = view.getUint32(optOff + 32, true);
        var fileAlignment = view.getUint32(optOff + 36, true);
        var sizeOfHeaders = view.getUint32(optOff + 60, true);

        var lastEnd = 0;
        for (var i = 0; i < numSections; i++) {
            var off = secTableOff + i * 40;
            var vsize = view.getUint32(off + 8, true);
            var vaddr = view.getUint32(off + 12, true);
            if (vaddr + vsize > lastEnd) lastEnd = vaddr + vsize;
        }

        function offsetToRva(foff) {
            for (var i = 0; i < numSections; i++) {
                var off = secTableOff + i * 40;
                var rawSize = view.getUint32(off + 16, true);
                var rawPtr = view.getUint32(off + 20, true);
                if (foff >= rawPtr && foff < rawPtr + rawSize) {
                    var vaddr = view.getUint32(off + 12, true);
                    return vaddr + (foff - rawPtr);
                }
            }
            return -1;
        }

        function findSig(sig) {
            for (var i = 0; i <= fileLen - sig.length; i++) {
                var ok = true;
                for (var j = 0; j < sig.length; j++) {
                    if (bytes[i + j] != sig[j]) { ok = false; break; }
                }
                if (ok) return i;
            }
            return -1;
        }

        var variants = [
            {
                sig: [0x8B,0x50,0x18,0x8B,0x48,0x3C,0x83,0xC2,0x07,0xC1,0xEA,0x03,
                      0x52,0x8B,0x50,0x10,0x0F,0xAF,0xD3,0x03,0x56,0x3C,0x51,0x52,0xE8],
                patchOff: 12, jmpbackOff: 19, cleanupStartDelta: 38,
                cleanupMarker: [0x33, 0xED], caveSize: 48,
                cave: [0x52, 0x8B,0x50,0x10, 0x0F,0xAF,0xD3, 0x51, 0x52,
                       0x8B,0x4E,0x18, 0x83,0xC1,0x07, 0xC1,0xE9,0x03,
                       0x8B,0x54,0x24,0x08, 0x03,0x14,0x24, 0x39,0xCA,
                       0x5A, 0x59, 0x77,0x05,
                       0xE9, 0,0,0,0,
                       0x83,0xC4,0x04, 0x45,
                       0xE9, 0,0,0,0,
                       0x90, 0x90, 0x90],
                jmp1Pos: 32, jmp1End: 36, jmp2Pos: 41, jmp2End: 45,
                patchNops: 2
            },
            {
                sig: [0x8B,0x41,0x18,0x83,0xC0,0x07,0xC1,0xE8,0x03,
                      0x50,0x8B,0x41,0x10,0xFF,0x71,0x3C,
                      0x0F,0xAF,0xC3,0x8B,0x4D,0x08,0x03,0x41,0x3C,0x50,0xE8],
                patchOff: 16, jmpbackOff: 22, cleanupStartDelta: 38,
                cleanupMarker: [0x33, 0xDB], caveSize: 45,
                cave: [0x0F,0xAF,0xC3, 0x8B,0x4D,0x08, 0x50, 0x52,
                       0x8B,0x51,0x18, 0x83,0xC2,0x07, 0xC1,0xEA,0x03,
                       0x8B,0x44,0x24,0x0C, 0x03,0x44,0x24,0x04, 0x39,0xD0,
                       0x5A, 0x58, 0x77,0x05,
                       0xE9, 0,0,0,0,
                       0x83,0xC4,0x08, 0x46,
                       0xE9, 0,0,0,0],
                jmp1Pos: 32, jmp1End: 36, jmp2Pos: 41, jmp2End: 45,
                patchNops: 1
            },
            {
                sig: [0x8B,0x57,0x0C,0x8B,0x04,0xAA,0x8B,0x48,0x14,0x8B,0x50,0x3C,0x8B,0x40,0x0C,
                      0x0F,0xAF,0xC3,0x03,0x46,0x3C,0x83,0xC1,0x07,0xC1,0xE9,0x03,0x51,0x52,0x50,0xE8],
                patchOff: 15, jmpbackOff: 21, cleanupStartDelta: 44,
                cleanupMarker: [0x33, 0xED], caveSize: 50,
                cave: [0x0F,0xAF,0xC3, 0x50, 0x52, 0x51,
                       0x89,0xCA, 0x83,0xC2,0x07, 0xC1,0xEA,0x03,
                       0x8B,0x4E,0x14, 0x83,0xC1,0x07, 0xC1,0xE9,0x03,
                       0x8B,0x44,0x24,0x08, 0x03,0xC2, 0x39,0xC8,
                       0x59, 0x5A, 0x58, 0x77,0x08,
                       0x03,0x46,0x3C,
                       0xE9, 0,0,0,0,
                       0x45,
                       0xE9, 0,0,0,0],
                jmp1Pos: 40, jmp1End: 44, jmp2Pos: 46, jmp2End: 50,
                patchNops: 1
            }
        ];

        var v = null, sigOff = -1;
        for (var vi = 0; vi < variants.length; vi++) {
            sigOff = findSig(variants[vi].sig);
            if (sigOff >= 0) { v = variants[vi]; break; }
        }
        if (sigOff < 0) {
            log('sig not found, may not be vulnerable');
            return;
        }

        var sigRva = offsetToRva(sigOff);
        var patchRva = sigRva + v.patchOff;
        var jmpbackRva = sigRva + v.jmpbackOff;

        var cleanupStart = sigOff + v.cleanupStartDelta;
        var cleanupRva = -1;
        for (var i = cleanupStart; i < cleanupStart + 16; i++) {
            if (bytes[i] == v.cleanupMarker[0] && bytes[i + 1] == v.cleanupMarker[1]) {
                cleanupRva = offsetToRva(i);
                break;
            }
        }
        if (cleanupRva < 0) {
            log('cleanup not found');
            return;
        }

        var loopCondRva = cleanupRva - 5;

        var caveRva = align(lastEnd, sectionAlignment);
        var caveSize = v.caveSize;
        var rawCaveSize = align(caveSize, fileAlignment);
        var caveFileOff = align(fileLen, fileAlignment);

        var newSecOff = secTableOff + numSections * 40;
        if (newSecOff + 40 > sizeOfHeaders) {
            log('??? no room for new section');
            return;
        }

        var cave = new Uint8Array(v.cave);
        var caveView = new DataView(cave.buffer);
        caveView.setInt32(v.jmp1Pos, jmpbackRva - (caveRva + v.jmp1End), true);
        caveView.setInt32(v.jmp2Pos, loopCondRva - (caveRva + v.jmp2End), true);

        var secName = '.rknpatch';
        for (var i = 0; i < secName.length; i++) bytes[newSecOff + i] = secName.charCodeAt(i);
        view.setUint32(newSecOff + 8, caveSize, true);
        view.setUint32(newSecOff + 12, caveRva, true);
        view.setUint32(newSecOff + 16, rawCaveSize, true);
        view.setUint32(newSecOff + 20, caveFileOff, true);
        view.setUint32(newSecOff + 36, 0xE0000020, true);

        view.setUint16(e_lfanew + 6, numSections + 1, true);
        view.setUint32(optOff + 56, align(caveRva + caveSize, sectionAlignment), true);

        var patchOff = sigOff + v.patchOff;
        view.setUint8(patchOff, 0xE9);
        view.setInt32(patchOff + 1, caveRva - (patchRva + 5), true);
        for (var i = 0; i < v.patchNops; i++) {
            view.setUint8(patchOff + 5 + i, 0x90);
        }

        var output = new Uint8Array(caveFileOff + rawCaveSize);
        output.set(bytes.subarray(0, fileLen), 0);
        output.set(cave, caveFileOff);

        var blob = new Blob([output], { type: 'application/octet-stream' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileInput.files[0].name.replace(/\.exe$/i, '.patched.exe');
        a.click();

        log('0x' + sigRva.toString(16));
        log('0x' + patchRva.toString(16));
        log('0x' + caveRva.toString(16));
        log('0x' + jmpbackRva.toString(16));
        log('0x' + loopCondRva.toString(16));
        log('done');
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
}
</script>
</body>
</html>
